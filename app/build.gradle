plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.blackshine.githubuploadhelper'
    compileSdk 35
    defaultConfig {
        applicationId 'com.blackshine.githubuploadhelper'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
